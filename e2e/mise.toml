[tasks.install]
run = "pnpm install --filter immich-e2e... --frozen-lockfile"

[tasks.test]
depends = ["//e2e:ci-setup", "//e2e:playwright-install"]
env._.path = "./node_modules/.bin"
run = "playwright test --project=ui"

[tasks.playwright-install]
env._.path = "./node_modules/.bin"
run = "playwright install chromium --only-shell"

[tasks."test-web"]
depends = ["//e2e:ci-setup", "//e2e:playwright-install"]
env._.path = "./node_modules/.bin"
run = "playwright test --project=ui"

[tasks.format]
env._.path = "./node_modules/.bin"
run = "prettier --check ."

[tasks."format-fix"]
env._.path = "./node_modules/.bin"
run = "prettier --write ."

[tasks.lint]
env._.path = "./node_modules/.bin"
run = "eslint \"src/**/*.ts\" --max-warnings 0"

[tasks."lint-fix"]
run = { task = "lint --fix" }

[tasks.check]
env._.path = "./node_modules/.bin"
run = "tsc --noEmit"


[tasks.ci-setup]
run = [
  { task = "//:sdk:install" },
  { task = "//:sdk:build" },
  { task = "//web:install" },
  { task = ":install" },
]


[tasks.ci-unit]
run = [
  { task = "//:sdk:install" },
  { task = "//:sdk:build" },
  { task = ":install" },
  { task = ":format" },
  { task = ":lint" },
  { task = ":check" },
]
